<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- daisyui and tailwind cdn  -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
    <title>Github Issues Tracker | Home</title>
</head>
<body class="font-geist bg-gray-100">
    <header>
        <div class="navbar bg-base-100 shadow-sm">
            <div class="flex-1">
              <a class="btn btn-ghost md:text-xl font-bold text-[#1F2937]">
                <img src="./assets/github-logo.png" alt="" class="w-11">
                Github Issues Tracker
              </a>
            </div>
            <div class="flex gap-2">
                <label class="input">
                    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                      <g
                        stroke-linejoin="round"
                        stroke-linecap="round"
                        stroke-width="2.5"
                        fill="none"
                        stroke="currentColor"
                      >
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.3-4.3"></path>
                      </g>
                    </svg>
                    <input id="search-input" type="search" required placeholder="Search" />
                  </label>
              <div>
                <button class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Issue</button>
              </div>
              </div>
            </div>
          </div>
    </header>
    
    <main class="w-11/12 mx-auto bg-gray-100">
        <!-- all filter btn  -->
        <div class="flex gap-4 my-6 bg-white p-3 rounded-2xl shadow">
            <button onclick="toggleStyle('all-filter-btn')" id="all-filter-btn" class="btn btn-primary">All</button>
            <button onclick="toggleStyle('open-filter-btn')" id="open-filter-btn" class="btn btn-soft">Open</button>
            <button onclick="toggleStyle('closed-filter-btn')" id="closed-filter-btn" class="btn btn-soft">Closed</button>
        </div>

        <!-- card section  -->
        <section class="shadow">
            <!-- card section nav  -->
             <div class="flex justify-between p-5 bg-white rounded-2xl shadow">
             <div class="flex justify-center items-center gap-2">
                <img src="./assets/Aperture.png" alt="" class="w-8 h-8">
                <div>
                    <h2 class="font-semibold text-xl text-prim"><span id="issues-count" >50</span> issues</h2>
                    <p class="text-p">Trck and manage your project</p>
                </div>
             </div>
             <div class="flex items-center justify-center gap-6 text-2xl font-semibold text-gray-800">

                <!-- Open -->
                <div class="flex items-center gap-3">
                  <span class="w-3 h-3 bg-green-500 rounded-full"></span>
                  <span class="text-base font-semibold">Open</span>
                </div>
              
                <!-- Closed -->
                <div class="flex items-center gap-3">
                  <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
                  <span class="text-base font-semibold">Closed</span>
                </div>
              
              </div>
            </div>

            <div id="card-container" class="my-9 mx-4 grid gap-4 grid-cols-1 md:grid-cols-3 lg:grid-cols-4">
              <!-- card -->
              
            </div>
        </section>
    </main>

    <script src="./script/home.js"></script>
</body>
</html>
